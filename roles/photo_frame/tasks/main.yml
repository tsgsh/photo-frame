---
- name: Confirm that we have valid parameters
  tags:
  - assert
  assert:
    that:
    - photo_frame_directory != none
    - photo_frame_nfs_source != none if photo_frame_rsync else true
    - photo_frame_scale in photo_frame_scales
    - photo_frame_time | int > 0

- name: Get the current systemd target state
  check_mode: false
  block:

  - name: Get the state of the systemd display-manager.target
    register: photo_frame_r_list_units
    changed_when: false
    command:  # noqa: command-instead-of-module
      cmd: systemctl list-units --type target --state active

  - name: Confirm that the systemd display-manager.target is not active
    assert:
      that: photo_frame_dm_target_state == none
      fail_msg: >-
        Photo-frame cannot be installed on top of a system with an active Display Manager
      quiet: true

- name: "{{ photo_frame_shell_sh_file }}"
  template:
    src: "{{ photo_frame_shell_sh_template }}"
    dest: "{{ photo_frame_shell_sh_file }}"
    mode: '0755'

- name: "Group {{ photo_frame_group }}"
  group:
    name: "{{ photo_frame_group }}"

- name: "User {{ photo_frame_group }}"
  register: photo_frame_r_user
  user:
    name: "{{ photo_frame_user }}"
    group: "{{ photo_frame_group }}"
    groups:
    - video
    - input
    - render
    - systemd-journal
    home: "{{ photo_frame_home }}"
    create_home: true
    password_lock: true
    shell: "{{ photo_frame_shell_sh_file }}"

- name: Confirm that the photo directory exists and is not empty
  when: photo_frame_nfs_source == none and not photo_frame_rsync
  tags:
  - check-directory
  block:

  - name: Check that the photo directory exists
    register: photo_frame_r_stat
    stat:
      path: "{{ photo_frame_directory }}"

  - name: Find JPEG files (with a minimum size of 100kB)
    register: photo_frame_r_find
    when: photo_frame_r_stat.stat.exists
    find:
      paths: "{{ photo_frame_directory }}"
      patterns: '*.jpg,*.jpeg,*.JPG,*.JPEG'
      recurse: true

  - name: Confirm that the photo directory exists and is not empty
    assert:
      that:
      - photo_frame_r_stat.stat.exists
      - photo_frame_r_find.matched > 0

- name: Photo directory
  when: photo_frame_rsync
  notify: Initial rsync
  tags:
  - target-directory
  file:
    path: "{{ photo_frame_dir_path }}"
    state: directory
    mode: '0755'
    owner: "{{ photo_frame_user }}"
    group: "{{ photo_frame_group }}"

- name: Install required software
  tags:
  - package
  package:
    name: "{{ photo_frame_packages }}"
    state: present

- name: Mount
  notify: Initial rsync
  tags:
  - mount
  block:

  - name: "{{ photo_frame_nfs_mount }}"
    when: photo_frame_nfs_source != none
    file:
      path: "{{ photo_frame_nfs_mount }}"
      state: directory
      mode: '0755'

  - name: "/etc/fstab entry for {{ photo_frame_nfs_mount }}"
    when: photo_frame_nfs_source != none
    notify:
    - Reload systemd
    - Enable and start automount
    ansible.posix.mount:
      src: "{{ photo_frame_nfs_source }}"
      path: "{{ photo_frame_nfs_mount }}"
      fstype: nfs
      state: present
      boot: false
      opts: ro,_netdev,x-systemd.automount

- name: "{{ photo_frame_config_file | dirname }}"
  file:
    path: "{{ photo_frame_config_file | dirname }}"
    state: directory
    mode: '0755'
    owner: "{{ photo_frame_user }}"
    group: "{{ photo_frame_group }}"

- name: "{{ photo_frame_getty_service_file | dirname }}"
  file:
    path: "{{ photo_frame_getty_service_file | dirname }}"
    state: directory
    mode: '0755'

- name: "{{ photo_frame_getty_service_file }}"
  notify: Enable and (re)start getty@tty1.service
  tags:
  - service
  template:
    src: "{{ photo_frame_getty_service_template }}"
    dest: "{{ photo_frame_getty_service_file }}"
    mode: '0644'

- name: "{{ photo_frame_config_file }}"
  notify: Enable and (re)start photo-frame.service
  tags:
  - config
  template:
    src: "{{ photo_frame_config_template }}"
    dest: "{{ photo_frame_config_file }}"
    mode: '0644'
    owner: "{{ photo_frame_user }}"
    group: "{{ photo_frame_group }}"

- name: "{{ photo_frame_bin }}"
  file:
    path: "{{ photo_frame_bin }}"
    state: directory
    mode: '0755'
    owner: "{{ photo_frame_user }}"
    group: "{{ photo_frame_group }}"

- name: "Create /run/{{ photo_frame_uid }}"
  file:
    path: "{{ photo_frame_state_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ photo_frame_user }}"
    group: "{{ photo_frame_group }}"

- name: Create user script files
  notify: Enable and (re)start getty@tty1.service
  block:

  - name: "{{ photo_frame_kiosk_sh_file }}"
    template:
      src: "{{ photo_frame_kiosk_sh_template }}"
      dest: "{{ photo_frame_kiosk_sh_file }}"
      mode: '0755'
      owner: "{{ photo_frame_user }}"
      group: "{{ photo_frame_group }}"

  - name: "{{ photo_frame_photo_sh_file }}"
    template:
      src: "{{ photo_frame_photo_sh_template }}"
      dest: "{{ photo_frame_photo_sh_file }}"
      mode: '0755'
      owner: "{{ photo_frame_user }}"
      group: "{{ photo_frame_group }}"

- name: Block for rsync
  when: photo_frame_rsync
  notify:
  - Initial rsync # reasonable assumption that if any of these change then we need rsync, and v.v.
  - Enable and (re)start getty@tty1.service
  tags:
  - rsync
  block:

  # rsync runs as a user timer/service
  - name: "{{ photo_frame_rsync_sh_file }}"
    template:
      src: "{{ photo_frame_rsync_sh_template }}"
      dest: "{{ photo_frame_rsync_sh_file }}"
      mode: '0755'
      owner: "{{ photo_frame_user }}"
      group: "{{ photo_frame_group }}"

  - name: "{{ photo_frame_systemd_user_dir }}"
    file:
      path: "{{ photo_frame_systemd_user_dir }}"
      state: directory
      mode: '0755'
      owner: "{{ photo_frame_user }}"
      group: "{{ photo_frame_group }}"

  - name: "{{ photo_frame_rsync_service_file }}"
    notify: Enable photo-frame-rsync.service
    template:
      src: "{{ photo_frame_rsync_service_template }}"
      dest: "{{ photo_frame_rsync_service_file }}"
      mode: '0644'
      owner: "{{ photo_frame_user }}"
      group: "{{ photo_frame_group }}"

  - name: "{{ photo_frame_rsync_timer_file }}"
    notify: Enable and start photo-frame-rsync.timer
    template:
      src: "{{ photo_frame_rsync_timer_template }}"
      dest: "{{ photo_frame_rsync_timer_file }}"
      mode: '0644'
      owner: "{{ photo_frame_user }}"
      group: "{{ photo_frame_group }}"

  # restart runs as a system path/service because it has to restart getty@tty1
  - name: "{{ photo_frame_restart_service_file }}"
    notify: Enable photo-frame-restart.service
    template:
      src: "{{ photo_frame_restart_service_template }}"
      dest: "{{ photo_frame_restart_service_file }}"
      mode: '0644'

  - name: "{{ photo_frame_restart_path_file }}"
    notify: Enable and start photo-frame-restart.path
    template:
      src: "{{ photo_frame_restart_path_template }}"
      dest: "{{ photo_frame_restart_path_file }}"
      mode: '0644'

- name: Manual rsync
  register: photo_frame_r_rsync
  become: true
  become_user: "{{ photo_frame_user }}"
  changed_when: photo_frame_r_rsync.stdout_lines | count > 0
  notify: Enable and (re)start photo-frame.service
  tags:
  - sync
  - rsync
  - never
  command:
    cmd: "{{ photo_frame_rsync_command }}"
