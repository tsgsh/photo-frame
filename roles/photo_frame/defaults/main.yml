---
# photo_frame_compositor: wayland
photo_frame_nfs_source:
photo_frame_nfs_mount: /mnt/photos
photo_frame_nfs_options: ro
photo_frame_directory: >-
  {{
    '/var/local/photo-frame' if photo_frame_rsync else
    photo_frame_nfs_mount if photo_frame_nfs_source != none and
                             photo_frame_subdirectory == none else
    [photo_frame_nfs_mount, photo_frame_subdirectory] |
    pathjoin if photo_frame_nfs_source != none else
    none
  }}
photo_frame_subdirectory:
photo_frame_rsync: false
photo_frame_rsync_timer:
photo_frame_rotate:
photo_frame_scale: optimal
photo_frame_time: 30
photo_frame_user: photo-frame
photo_frame_group: "{{ photo_frame_user }}"
photo_frame_display: 'wayland-0'
photo_frame_output: 'HDMI-A-1'

photo_frame_restart_limit: 5
photo_frame_restart_window: 300
