---
# need a constant default for ole validation
photo_frame_packages:
- cage
- seatd
- swayimg
# - wtypePHASE 3 definitely
photo_frame_scales:
- optimal
- width
- height
- fit
- fill
- real

# paths that we will use; these two may be the same
photo_frame_nfs_path: "{{ [photo_frame_nfs_mount, photo_frame_subdirectory] |
                          reject('eq', none) |
                          join('/') }}"
photo_frame_dir_path: "{{ [photo_frame_directory, photo_frame_subdirectory] |
                          reject('eq', none) |
                          join('/') }}"

# systemd mount
# Ansible doesn't yet implement a systemd-escape filter
# https://github.com/ansible-collections/community.general/issues/2601
# anything other than a hyphen is a corner case we aren't worrying about
photo_frame_mount: "{{ photo_frame_nfs_mount[1:] | replace('-', '\\x2d') | replace('/', '-') }}"

# user info
photo_frame_uid: "{{ photo_frame_r_user.uid }}"
photo_frame_home: "/home/{{ photo_frame_user }}"
photo_frame_bin: "{{ photo_frame_home }}/bin"

# system systemd templates
photo_frame_getty_service_template: getty.service.j2
photo_frame_restart_service_template: restart.service.j2
photo_frame_restart_path_template: restart.path.j2
# user systemd templates
photo_frame_rsync_service_template: rsync.service.j2
photo_frame_rsync_timer_template: rsync.timer.j2
# other templates
photo_frame_config_template: config.j2
photo_frame_shell_sh_template: shell.sh.j2
photo_frame_kiosk_sh_template: kiosk.sh.j2
photo_frame_photo_sh_template: photo.sh.j2
photo_frame_rsync_sh_template: rsync.sh.j2
# system systemd template destinatons
photo_frame_getty_service_file: "/etc/systemd/system/getty@tty1.service.d/autologin.conf"
photo_frame_restart_service_file: /etc/systemd/system/photo-frame-restart.service
photo_frame_restart_path_file: /etc/systemd/system/photo-frame-restart.path
# system user template destinations
photo_frame_systemd_user_dir: "{{ photo_frame_home }}/.config/systemd/user"
photo_frame_service_file: "{{ photo_frame_systemd_user_dir }}/photo-frame.service"
photo_frame_rsync_service_file: "{{ photo_frame_systemd_user_dir }}/photo-frame-rsync.service"
photo_frame_rsync_timer_file: "{{ photo_frame_systemd_user_dir }}/photo-frame-rsync.timer"
# other template destinations
photo_frame_config_file: "{{ photo_frame_home }}/.config/swayimg/config"
photo_frame_shell_sh_file: /usr/local/bin/photo-frame-shell.sh
photo_frame_kiosk_sh_file: "{{ photo_frame_bin }}/photo-frame-kiosk.sh"
photo_frame_photo_sh_file: "{{ photo_frame_bin }}/photo-frame.sh"
photo_frame_rsync_sh_file: "{{ photo_frame_bin }}/photo-frame-rsync.sh"
photo_frame_state_dir: "/run/{{ photo_frame_uid }}/state"
photo_frame_systemd_user_environment:
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ photo_frame_uid }}/bus"
  XDG_RUNTIME_DIR: "/run/user/{{ photo_frame_uid }}"

photo_frame_rsync_command: >-
  rsync
  --archive
  --itemize-changes
  --delete
  --out-format='%i'
  {{ photo_frame_nfs_path }}/
  {{ photo_frame_dir_path }}/
photo_frame_rsync_touch_file: "{{ photo_frame_home }}/photo-frame-rsync.changed"

photo_frame_dm_target_state: "{{ photo_frame_r_list_units.stdout |
                                 community.general.jc('systemctl') |
                                 selectattr('unit', 'eq', 'display-manager.target') |
                                 map(attribute='active') |
                                 first |
                                 default(none) }}"
