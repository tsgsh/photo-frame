---
argument_specs:
  main:
    short_description: Main entrypoint for the photo_frame role
    description: >-
      This role configures **swayimg** to display photos on a monitor or other display screen.
    version_added: '0.2.0'
    author:
    - Steve Hayes
    options:
      photo_frame_user:
        type: str
        default: photo-frame
        description: >-
          The name of the passowrdless user that will be auto-logged on to run
          `cage` and `swayimg`.
      photo_frame_group:
        type: str
        default: "{{ photo_frame_user }}"
        description: >-
          The name of the group for the passowrdless user that will be auto-logged on to run
          `cage` and `swayimg`.
      photo_frame_nfs_source:
        type: str
        description: >-
          An NFS export to be mounted (presumably containing the photos to use but this is not
          checked).
          This will be mounted using a `systemd` automount.


          Default: no NFS automount will be performed
      photo_frame_nfs_mount:
        type: str
        default: /mnt/photos
        description: The mount point for the NFS volume.
      photo_frame_nfs_options:
        type: str
        default: ro
        description: The options for the NFS mount.
      photo_frame_directory:
        type: str
        default: "{{ photo_frame_nfs_mount if photo_frame_nfs_source != none else none }}"
        description: >-
          The directory containing the photos to show


          Default: *`photo_frame_nfs_mount`* if *`photo_frame_nfs_source`* is defined,
          otherwise `none` (which is not valid)
      photo_frame_scale:
        type: str
        choices:
        - optimal
        - width
        - height
        - fit
        - fill
        - real
        default: optimal
        description: >-
          How to scale photos to fit the screen.


          The value of the
          [**scale**](https://manpages.debian.org/trixie/swayimg/swayimgrc.5.en.html#scale)
          setting in the **viewer** sectionof the `swayimg` configuration file
          (`/etc/xdg/swayimg/config`).
      photo_frame_time:
        type: float
        default: 30.0
        description: >-
          The value of the
          [**slideshow_time**](https://manpages.debian.org/trixie/swayimg/swayimgrc.5.en.html#slideshow_time)
          setting in the **viewer** section of the `swayimg` configuration file
          (`/etc/xdg/swayimg/config`).
      photo_frame_restart_limit:
        type: int
        description: >-
          How many times the photo frame can repeatedly restart before it exits to the shell.
        default: 5
      photo_frame_restart_window:
        type: int
        description: >-
          The time window during which consecutive restarts are regarded as "repeated".
        default: 300
