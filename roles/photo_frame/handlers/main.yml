- name: Restart graphical environment
  loop:
  - multi-user
  - graphical
  changed_when: true
  command:
    cmd: "systemctl isolate {{ item }}.target"  # noqa: command-instead-of-module

- name: Enable and (re)start photo_frame service
  listen:
  - Enable and (re)start photo_frame service
  - Restart graphical environment
  systemd:
    name: "{{ photo_frame_service_name }}.service"
    state: restarted
    enabled: true
    daemon_reload: true
