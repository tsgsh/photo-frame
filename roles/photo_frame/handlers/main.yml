---
- name: Reboot
  listen: Sway handler
  when: not photo_frame_sway_running | default(true)
  reboot:

- name: End play  # no need to run any remaining handlers after a reboot
  listen: Sway handler
  when: not photo_frame_sway_running | default(true)
  meta: end_play

- name: Reload sway
  listen: Sway handler
  when: photo_frame_sway_running | default(false)
  changed_when: true
  become: true
  become_user: "{{ photo_frame_user }}"
  command:
    cmd: /usr/bin/swaymsg reload

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Enable and (re)start photo_frame service
  listen:
  - Enable and (re)start photo_frame service
  - Restart graphical environment
  systemd:
    name: "{{ photo_frame_service_name }}.service"
    state: restarted
    enabled: true
    daemon_reload: true
